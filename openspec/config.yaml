schema: spec-driven

context: |
  Project: L2 Unity client (Lineage 2 recreation in Unity).
  Tech stack: Unity 6, C#, Universal Render Pipeline (URP 17.x), FMOD, UI Toolkit.
  Unity project root: l2-unity/ (repo root also contains l2-unity-fmod/).
  Conventions: match existing C# style in Assets/Scripts; minimize scope per change.
  Domain: MMORPG client — networking, entities, terrain, UI, audio, rendering.

